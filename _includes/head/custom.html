{% include base_path %}

<style>
  .site-theme-icon, .site-footer-icon { display: inline-block; flex: none; vertical-align: -0.12em; }
  .site-footer-icon { fill: currentColor; }
  [data-theme-icon-moon] { display: none; }
  html[data-theme="dark"] [data-theme-icon-sun] { display: none; }
  html[data-theme="dark"] [data-theme-icon-moon] { display: block; }
</style>

<!-- start custom head snippets -->

<!-- Support for Academicons -->
{% unless page.layout == "portfolio" %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>
{% endunless %}

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
{% if page.layout == "portfolio" %}
<link rel="stylesheet" href="{{ base_path }}/assets/css/portfolio.css?v=20260719-nava-center"/>
<meta name="theme-color" content="#f5f7fb"/>
{% if page.url == "/" %}
<link rel="preload" as="image" type="image/avif"
      href="{{ '/assets/media/journey/meitan/meitan-01-1200.avif' | relative_url }}"
      imagesrcset="{{ '/assets/media/journey/meitan/meitan-01-720.avif' | relative_url }} 720w, {{ '/assets/media/journey/meitan/meitan-01-1200.avif' | relative_url }} 1200w"
      imagesizes="(max-width: 820px) calc(100vw - 64px), 40vw"
      fetchpriority="high"/>
{% endif %}
{% else %}
<meta name="theme-color" content="#ffffff"/>
{% endif %}

<!-- end custom head snippets -->
